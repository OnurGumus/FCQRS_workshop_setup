# Bakes the workshop devcontainer image (base + exact .NET 11 preview SDK)
# and pushes it to GHCR. Attendees' Codespaces then PULL this image instead of
# each downloading and extracting the SDK at container build — the difference
# between a ~1 minute and a ~8 minute cold start, times 30 attendees.
#
# NB: after the first push, set the package visibility to PUBLIC once
# (https://github.com/users/OnurGumus/packages/container/fcqrs-workshop-dotnet11/settings)
# or anonymous Codespace pulls will fail.
name: devcontainer image

on:
  push:
    branches: [master]
    paths:
      - ".devcontainer/Dockerfile"
      - ".github/workflows/devcontainer-image.yaml"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          # amd64 for Codespaces, arm64 for local devcontainers on Apple Silicon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/onurgumus/fcqrs-workshop-dotnet11:11.0.100-preview.5.26302.115
            ghcr.io/onurgumus/fcqrs-workshop-dotnet11:latest
